# ============================================================
# GriefDetector 設定ファイル
# 変更後は /griefdetect reload で反映できます（再起動不要）
# ============================================================

# プラグイン全体のマスタースイッチ。false にすると全検知を即座に停止します。
enabled: true

discord:
  # Discord の Webhook URL（サーバー設定 > 連携サービス > ウェブフック で発行）
  # 空のままだと Discord 通知はスキップされ、コンソール/ゲーム内通知のみになります。
  webhook-url: ""
  # Webhook の表示名
  username: "GriefDetector"
  # 同一プレイヤー・同一種別のアラートを再送するまでの最短間隔（秒）。通知スパム防止。
  cooldown-seconds: 60

# ゲーム内通知（griefdetector.notify 権限を持つプレイヤーに表示）
in-game-notify: true

# GrimAC 連携（Tier A）
#
# 【責務分担】検知の通知（Discord）は本プラグイン、プレイヤーへの対策は Grim が担います。
#  - Grim はチート挙動をリアルタイムでセットバック（巻き戻し）して無効化します。
#    キック/BAN は Grim の plugins/GrimAC/punishments.yml で設定してください。
#  - 通知の重複を避けるため、Grim 側の discord.yml は無効のままを推奨します。
grim:
  # true かつ GrimAC が導入されていれば、Grim の違反フラグをアラートに変換します。
  enabled: true
  # Grim のチェック名にこれらの語（部分一致・大文字小文字無視）が含まれる場合、
  # 「異常移動速度」アラートとして扱います。
  speed-checks: [Speed, Timer, Motion, Elytra, Vehicle, Simulation, Prediction]
  # 同様に「Nuker」アラートとして扱うチェック名。
  nuker-checks: [Nuker, FastBreak, BadPackets, AirPlace, Break, Dig]
  # 同様に「不正飛行」アラートとして扱うチェック名。
  fly-checks: [Fly, NoFall, GroundSpoof, Levitation]
  # 同様に「近接戦闘系」アラートとして扱うチェック名。
  combat-checks: [Killaura, Reach, HitBox, AutoClicker, Aim, Rotation]
  # この違反回数（Grim側のVL）未満のフラグは無視します。誤検知ノイズ対策。
  min-violations: 5

detectors:
  # ---- TNT検知（完全自前実装） ----
  tnt:
    enabled: true
    # この秒数のウィンドウ内で
    window-seconds: 60
    # この回数を超えて TNT を着火したらアラート
    max-ignitions: 5

  # ---- 異常移動速度検知 ----
  speed:
    enabled: true
    # auto   : GrimAC があれば Grim に任せ、自前ロジックは無効化（推奨）
    # grim   : Grim 連携のみ（Grim 未導入なら何もしない）
    # custom : 常に自前ロジックを使用（※簡易判定のため誤検知しえます）
    # off    : このモジュールを無効化（enabled: false と同じ）
    mode: auto
    # 水平移動速度の上限（ブロック/秒）。素の全力疾走ジャンプは約 7.1 b/s。
    max-horizontal-blocks-per-second: 12.0
    # この秒数連続で超過した場合のみアラート（瞬間的なノックバック等を除外）
    sustained-seconds: 3

  # ---- Nuker検知 ----
  nuker:
    enabled: true
    # speed.mode と同じ意味
    mode: auto
    # このウィンドウ（秒）内で
    window-seconds: 2
    # この個数を超えるブロック破壊があればアラート
    max-breaks: 30

  # ---- 飛行検知（エリトラ以外） ----
  fly:
    enabled: true
    # speed.mode と同じ意味
    mode: auto
    # 接地せず・落下もせずに空中に留まり続けた秒数がこれに達したらアラート
    # （エリトラ・浮遊/低速落下効果・水中・はしご・騎乗・飛行許可は除外）
    max-airborne-seconds: 5

  # ---- 放火・延焼検知（TNT以外。完全自前実装） ----
  arson:
    enabled: true
    # この秒数のウィンドウ内で
    window-seconds: 60
    # この回数を超えてフリント&スチール/ファイアボールで着火したらアラート
    max-ignitions: 5

  # ---- Xray検知（完全自前実装・GrimAC非依存） ----
  # 統計的異常検知であり「たまたま高効率で掘り当てた」可能性を否定できないため、
  # 常に warning（Discord embed は橙）として通知されます。
  xray:
    enabled: true
    # このウィンドウ（秒）内で
    window-seconds: 300
    # この個数を超える貴重鉱石の採掘があれば warning
    max-ore-breaks: 8
    # 対象とする貴重鉱石
    ores: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE, ANCIENT_DEBRIS, EMERALD_ORE, DEEPSLATE_EMERALD_ORE]

  # ---- 近接戦闘系検知（Reach/Killaura/オートクリッカー等） ----
  # GrimAC 連携専任（自前ロジックなし）。Grim の戦闘系チェックフラグをそのままアラート化する。
  combat:
    enabled: true
    # auto : GrimAC があれば Grim に任せる（推奨）。無ければ何もしない
    # grim : Grim 連携のみ（Grim 未導入なら何もしない）
    # off  : このモジュールを無効化（enabled: false と同じ）
    # ※ custom（自前ロジック）はサポート外です
    mode: auto
